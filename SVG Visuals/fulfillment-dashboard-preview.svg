<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Order Flow and Fulfillment dashboard mockup</title>
  <desc id="desc">A dark navy business intelligence dashboard preview with four KPI cards, a monthly revenue line chart, category profit bars, and an order fulfillment summary. Static design mockup using the project's fictional 2025 sample data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c31"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#36d6c3"/><stop offset="1" stop-color="#5b9cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1440" height="78" fill="#0e1728"/>
  <rect x="0" y="76" width="1440" height="2" fill="url(#accent)" opacity=".8"/>
  <text x="56" y="48" fill="#f2f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">NORTHSTAR</text>
  <text x="225" y="48" fill="#71839f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">OPERATIONS INTELLIGENCE</text>
  <text x="1048" y="45" fill="#8ea1bd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">REPORTING PERIOD</text>
  <rect x="1178" y="22" width="202" height="36" rx="8" fill="#18253a" stroke="#2b3c55"/>
  <text x="1194" y="45" fill="#e2eaf5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Jan – Dec 2025</text>
  <text x="56" y="127" fill="#f3f7fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Order Flow &amp; Fulfillment</text>
  <text x="56" y="155" fill="#8798b2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">A clear view of sales performance, product mix, and delivery operations</text>
  <rect x="1190" y="104" width="190" height="42" rx="9" fill="#152239" stroke="#2b3c55"/>
  <circle cx="1212" cy="125" r="5" fill="#36d6c3"/>
  <text x="1227" y="130" fill="#c9d5e6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">All regions</text>
  <path d="M1356 121l6 6 6-6" fill="none" stroke="#8ea1bd" stroke-width="2"/>

  <!-- KPI cards -->
  <g filter="url(#shadow)">
    <rect x="56" y="184" width="318" height="126" rx="14" fill="#152239" stroke="#263853"/>
    <rect x="394" y="184" width="318" height="126" rx="14" fill="#152239" stroke="#263853"/>
    <rect x="732" y="184" width="318" height="126" rx="14" fill="#152239" stroke="#263853"/>
    <rect x="1070" y="184" width="310" height="126" rx="14" fill="#152239" stroke="#263853"/>
  </g>
  <text x="80" y="219" fill="#91a2bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1">TOTAL REVENUE</text>
  <text x="80" y="265" fill="#f3f7fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">$4,357.30</text>
  <text x="80" y="289" fill="#36d6c3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">●  24 orders in sample</text>
  <text x="418" y="219" fill="#91a2bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1">GROSS PROFIT</text>
  <text x="418" y="265" fill="#f3f7fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">$1,675.55</text>
  <text x="418" y="289" fill="#36d6c3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">●  Revenue less cost</text>
  <text x="756" y="219" fill="#91a2bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1">PROFIT MARGIN</text>
  <text x="756" y="265" fill="#f3f7fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">38.4%</text>
  <text x="756" y="289" fill="#91a2bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Profit / revenue</text>
  <text x="1094" y="219" fill="#91a2bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="1">AVG. DELIVERY</text>
  <text x="1094" y="265" fill="#f3f7fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700">4.7 days</text>
  <text x="1094" y="289" fill="#91a2bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Order to delivery</text>

  <!-- Monthly revenue chart panel -->
  <rect x="56" y="334" width="846" height="386" rx="14" fill="#152239" stroke="#263853" filter="url(#shadow)"/>
  <text x="82" y="374" fill="#eff5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Monthly revenue</text>
  <text x="82" y="398" fill="#8294ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Revenue by order month · USD</text>
  <text x="812" y="376" fill="#36d6c3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">2025</text>
  <g stroke="#2b3b53" stroke-width="1">
    <line x1="116" y1="445" x2="858" y2="445"/><line x1="116" y1="505" x2="858" y2="505"/><line x1="116" y1="565" x2="858" y2="565"/><line x1="116" y1="625" x2="858" y2="625"/>
  </g>
  <g fill="#8294ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="end">
    <text x="105" y="449">$500</text><text x="105" y="509">$350</text><text x="105" y="569">$200</text><text x="105" y="629">$50</text>
  </g>
  <path d="M132 590 L194 505 L256 457 L318 545 L380 461 L442 447 L504 560 L566 500 L628 453 L690 553 L752 461 L814 440 L814 625 L132 625 Z" fill="#36d6c3" opacity=".10"/>
  <path d="M132 590 L194 505 L256 457 L318 545 L380 461 L442 447 L504 560 L566 500 L628 453 L690 553 L752 461 L814 440" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#142239" stroke="#36d6c3" stroke-width="3">
    <circle cx="132" cy="590" r="5"/><circle cx="194" cy="505" r="5"/><circle cx="256" cy="457" r="5"/><circle cx="318" cy="545" r="5"/><circle cx="380" cy="461" r="5"/><circle cx="442" cy="447" r="5"/><circle cx="504" cy="560" r="5"/><circle cx="566" cy="500" r="5"/><circle cx="628" cy="453" r="5"/><circle cx="690" cy="553" r="5"/><circle cx="752" cy="461" r="5"/><circle cx="814" cy="440" r="5"/>
  </g>
  <g fill="#8294ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="middle">
    <text x="132" y="654">Jan</text><text x="194" y="654">Feb</text><text x="256" y="654">Mar</text><text x="318" y="654">Apr</text><text x="380" y="654">May</text><text x="442" y="654">Jun</text><text x="504" y="654">Jul</text><text x="566" y="654">Aug</text><text x="628" y="654">Sep</text><text x="690" y="654">Oct</text><text x="752" y="654">Nov</text><text x="814" y="654">Dec</text>
  </g>
  <rect x="82" y="680" width="10" height="10" rx="3" fill="#36d6c3"/><text x="100" y="690" fill="#91a2bc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Revenue</text>

  <!-- Category profit panel -->
  <rect x="922" y="334" width="458" height="386" rx="14" fill="#152239" stroke="#263853" filter="url(#shadow)"/>
  <text x="950" y="374" fill="#eff5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Profit by category</text>
  <text x="950" y="398" fill="#8294ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Which product groups contribute most?</text>
  <g fill="#8294ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
    <text x="950" y="463">Furniture</text><text x="950" y="523">Electronics</text><text x="950" y="583">Office</text>
  </g>
  <g>
    <rect x="950" y="477" width="300" height="15" rx="7" fill="#22334b"/><rect x="950" y="477" width="286" height="15" rx="7" fill="#36d6c3"/>
    <rect x="950" y="537" width="300" height="15" rx="7" fill="#22334b"/><rect x="950" y="537" width="176" height="15" rx="7" fill="#4ba9e8"/>
    <rect x="950" y="597" width="300" height="15" rx="7" fill="#22334b"/><rect x="950" y="597" width="140" height="15" rx="7" fill="#8b7cf6"/>
  </g>
  <g fill="#d5dfed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="end">
    <text x="1348" y="489">$1,003</text><text x="1348" y="549">$506</text><text x="1348" y="609">$167</text>
  </g>
  <line x1="950" y1="640" x2="1352" y2="640" stroke="#2b3b53"/>
  <text x="950" y="672" fill="#8294ae" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Category profit totals use Revenue − Cost.</text>

  <rect x="56" y="746" width="1324" height="94" rx="14" fill="#122a35" stroke="#1c625e"/>
  <circle cx="88" cy="793" r="16" fill="#1c625e"/><path d="M81 793l5 5 10-11" fill="none" stroke="#b8fff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="782" fill="#b8fff0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="650">Portfolio insight</text>
  <text x="120" y="808" fill="#c4d5dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Furniture contributes the largest share of sample profit; use region and segment filters to explore the mix before drawing conclusions.</text>
  <text x="56" y="872" fill="#657791" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">DESIGN MOCKUP · FICTIONAL SAMPLE DATA · NOT A POWER BI SCREENSHOT</text>
  <text x="1380" y="872" fill="#657791" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" text-anchor="end">POWER BI CUSTOM VISUALS LAB</text>
</svg>
